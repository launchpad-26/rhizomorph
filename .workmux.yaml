# Fleet config — The Rhizomorph build day (2026-07-30).
#
# The 2026-07-30 ruling — workers run with skipped permissions in isolated
# worktrees (throwaway repo, no secrets, non-root user) — was WITHDRAWN by the
# operator on 2026-08-13. Lanes ask. A lane that reaches an approval prompt goes
# to `waiting` and sits there, which is the correct outcome for a dispatched
# agent rather than something to route around: a lane with nobody to ask should
# stop and be asked about. The sidebar is how you see it waiting.
#
# The file that actually carries this: `scripts/lane-agent.sh` execs Claude
# Code with no `--dangerously-skip-permissions` flag (#64, fixed 2026-08-25 —
# it briefly passed the flag, contradicting this comment, and every lane
# dispatched through it ran bypassed against the withdrawn ruling until the
# wrapper was corrected). This config's own `agent:` line below is the
# default; dispatch still goes through the wrapper via
# `-a "bash scripts/lane-agent.sh <model>"` for the telemetry wiring — see
# the note near that flag further down.
#
# `claude-study` is ~/.local/bin/claude-study — a real executable, NOT a zsh
# alias. workmux launches the agent outside the pane command's shell, so an
# alias resolves to nothing there. It runs Claude Code under its own config
# directory (~/.claude-study) so lane state never mixes with the operator's own
# session, and it carries no permission flags.
# REVIEW OF #504: the line above described `claude-study`, a wrapper in ONE
# contributor's ~/.local/bin (isolating lane state under ~/.claude-study).
# Fine as a personal tool -- but this file is tracked and shared, and workmux
# launches whatever this line names on every contributor's box; a binary only
# one machine has turns every other contributor's dispatch into a dead pane
# (the stranger's-machine rule, AGENTS.md). Plain `claude`, still with no
# permission flags, keeps the ask-before-acting substance portably. Anyone
# wanting the study-config isolation locally can shim it on their own box.
agent: claude --model sonnet

merge_strategy: merge   # keep the DAG visible — the Rhizomorph renders it

post_create:
  # Dependencies, under the version .nvmrc pins and with failure VISIBLE.
  #
  # This was `[ -f package.json ] && npm install || true`, and both halves were
  # wrong once #403 landed the Node floor:
  #
  #   * it ran under whatever node the shell happened to have. #403 set
  #     `engine-strict=true` so a wrong version REFUSES rather than warns, and
  #     `jsdom` excludes the range a common default sits in — so the install
  #     failed on a correctly-configured machine;
  #   * `|| true` then swallowed it, and workmux printed "Setup complete" over
  #     a worktree with no `node_modules`. The lane discovered it at `npm test`,
  #     where it reads as a broken branch rather than a broken setup.
  #
  # Measured: two consecutive lanes had to be rescued by hand before anyone
  # noticed the hook had never worked. A green report over a step that did not
  # happen is the failure this repo names first, and #403's own rationale was
  # that a wrong Node "degrades loudly, the way the collectors do" — that
  # loudness was being discarded one layer up.
  #
  # `npm ci` rather than `npm install`: it installs from the lockfile exactly
  # and cannot dirty it, which is why every lane brief has to say "never commit
  # package-lock.json". Fixed at the source instead of asked of each lane.
  - |
    if [ -f package.json ]; then
      export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
      # shellcheck disable=SC1091
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      if [ -f .nvmrc ] && command -v nvm >/dev/null 2>&1; then
        nvm use "$(cat .nvmrc)" >/dev/null || {
          echo "!! setup: node $(cat .nvmrc) is not installed — run: nvm install $(cat .nvmrc)" >&2
          exit 1
        }
      fi
      npm ci || {
        echo "!! setup: npm ci FAILED — this worktree has no node_modules and its gates will not run" >&2
        exit 1
      }
    fi
  # AGENTS.md and CLAUDE.md are both tracked (#399), so git puts the runbook and
  # its Claude-side import into every worktree by itself. Only CLAUDE.local.md
  # has to be carried across: it is per-contributor and gitignored, so git will
  # not create it in a new worktree.
  #
  # The version of this hook that copied AGENTS.md was copying a file that did
  # not exist — both files were gitignored repo-wide between 2d77e5b and #399,
  # so the main checkout had no copy to hand out. The rule now documents itself
  # in AGENTS.md, which is where it belongs.
  #
  # `--git-common-dir` is how a linked worktree finds the main checkout; same
  # idiom as scripts/lane-agent.sh. The copy is an ignored file, so it cannot
  # dirty the worktree or reach a commit. Non-fatal by design — a contributor
  # who keeps no CLAUDE.local.md is the common case.
  - 'M=$(dirname "$(git rev-parse --git-common-dir)") && cp "$M/CLAUDE.local.md" . 2>/dev/null || true'

# prd1 telemetry (docs/telemetry.md): every lane's agent exports OTLP/HTTP
# JSON straight to this repo's own Rhizomorph server (the receiver at
# packages/server/src/api/otel.ts), tagged lane=<worktree handle>,role=worker
# and — since prd2 #60 — instance=<the running server's session id>.
#
# The block is no longer duplicated here: `rhizomorph env <lane>` renders it,
# including the instance id it reads from the server's /api/meta, and the pane
# evals that. One source of truth, and the port lives in exactly one place
# below (default 4321 — change it if the Rhizomorph was started elsewhere).
#
# The Rhizomorph must be running when a lane is dispatched. It always is at
# dispatch time, and if it isn't, the pane says so and starts the agent anyway:
# the exports then carry no instance id, the receiver answers 403 and records
# one `telemetry.refused` event per minute, so the gap shows up as a setup gap
# in the dashboard rather than as silently missing spend.
# SCAR (2026-08-04, twice-learned): a pane-command env prefix NEVER reaches
# the agent — workmux launches the agent outside the pane command's shell
# (proven via /proc/<agent>/environ after two prefix "fixes" changed
# nothing). Telemetry env now lives in scripts/lane-agent.sh, which evals it
# in the SAME process that execs claude — inheritance by construction.
# Dispatch with: -a "bash scripts/lane-agent.sh <model>".
panes:
  - command: <agent>
    focus: true
  - split: horizontal

# Mechanical merge gate: workmux refuses to merge red branches.
pre_merge:
  - cd "$WM_WORKTREE_PATH" && npm test
  - cd "$WM_WORKTREE_PATH" && npm run typecheck
