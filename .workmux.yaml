# Fleet config — The Rhizomorph build day (2026-07-30).
# Ruling: workers run with skipped permissions in isolated worktrees
# (throwaway repo, no secrets, non-root user).
agent: claude --model sonnet --dangerously-skip-permissions

merge_strategy: merge   # keep the DAG visible — the Rhizomorph renders it

post_create:
  - "[ -f package.json ] && npm install || true"

# prd1 telemetry (docs/telemetry.md): every lane's agent exports OTLP/HTTP
# JSON straight to this repo's own Rhizomorph server (the receiver at
# packages/server/src/api/otel.ts), tagged lane=<worktree handle>,role=worker
# and — since prd2 #60 — instance=<the running server's session id>.
#
# The block is no longer duplicated here: `rhizomorph env <lane>` renders it,
# including the instance id it reads from the server's /api/meta, and the pane
# evals that. One source of truth, and the port lives in exactly one place
# below (default 4321 — change it if the Rhizomorph was started elsewhere).
#
# The Rhizomorph must be running when a lane is dispatched. It always is at
# dispatch time, and if it isn't, the pane says so and starts the agent anyway:
# the exports then carry no instance id, the receiver answers 403 and records
# one `telemetry.refused` event per minute, so the gap shows up as a setup gap
# in the dashboard rather than as silently missing spend.
# SCAR (2026-08-04, twice-learned): a pane-command env prefix NEVER reaches
# the agent — workmux launches the agent outside the pane command's shell
# (proven via /proc/<agent>/environ after two prefix "fixes" changed
# nothing). Telemetry env now lives in scripts/lane-agent.sh, which evals it
# in the SAME process that execs claude — inheritance by construction.
# Dispatch with: -a "bash scripts/lane-agent.sh <model>".
panes:
  - command: <agent>
    focus: true
  - split: horizontal

# Mechanical merge gate: workmux refuses to merge red branches.
pre_merge:
  - cd "$WM_WORKTREE_PATH" && npm test
  - cd "$WM_WORKTREE_PATH" && npm run typecheck
