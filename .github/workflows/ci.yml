name: CI

on:
  push:
    branches: [main]
  pull_request:

# prd-34 (#563) adds `electron` as a devDependency of `packages/app`, and
# electron's postinstall downloads a ~110 MB platform binary. NOTHING in this
# workflow launches it: the shell's own tests are pure (`packages/app/src/host/`
# imports no electron at all), `npm run build` only bundles the main process
# with esbuild, and the boot smoke drives the plain CLI. Every leg here would
# therefore pay for a binary none of them runs — seven downloads per push.
#
# The binary IS downloaded where it is actually needed: #565's packaging
# workflow builds the installers and deliberately does not set this.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  build-test-boot:
    # macos-latest bills 10x ubuntu-latest, so it runs the suite once (at
    # current node) rather than doubling with the min-node leg too — the
    # min-node floor still gets checked, on the cheaper runner. The
    # macOS leg exists because a case-only filename collision (#201's class)
    # is invisible on Linux's case-sensitive filesystem and silent on
    # checkout on macOS's default case-insensitive one — this is the leg
    # that would have caught it before a user did.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [current, min]
        exclude:
          - os: macos-latest
            node: min
    runs-on: ${{ matrix.os }}
    steps:
      # FULL history, not the default depth-1 shallow checkout: `Test` below runs
      # `doc-citation-law`, whose tree-pin exclusion (#228) asks the local object
      # store whether a dated artefact's declared sha is a real commit
      # (`git cat-file -e <sha>^{commit}`). In a shallow clone every sha but the
      # tip is absent, so an HONEST pin reads as a fake one: the one real pinned
      # record, `docs/design/glance-2026-09-02.md` at `0851512`, is reported by
      # `badPins()` and swept as a live claim — the defect #228 fixes, reappearing
      # on CI only. Proved both directions in a depth-1 clone of this tree: 1
      # failed there, 29 passed after `git fetch --unshallow` (review of #229).
      # `pack-smoke` below runs no suite and stays shallow. The law asserts this
      # precondition itself, so an edit back to the default fails with a sentence
      # rather than a mystery bad-pin report.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (current, from engines)
        if: matrix.node == 'current'
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup Node (declared minimum, pinned exactly)
        if: matrix.node == 'min'
        uses: actions/setup-node@v4
        with:
          # The floor package.json's engines.node declares — pinned exactly,
          # not resolved by setup-node's usual range matching, so a bump to
          # the declared minimum is verified rather than assumed.
          node-version: '22.22.2'

      - name: Install (clean, lockfile-honest)
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        if: "!cancelled()"
        run: npm run typecheck

      - name: Lint
        if: "!cancelled()"
        run: npm run lint

      # Gated on Build's own outcome, not always(): the packaging guard only
      # flags UNEXPECTED files and passes vacuously over an empty dist/, and
      # the boot smoke's bin falls back to running TS source when dist is
      # absent (packages/server/bin/rhizomorph.mjs) — so on a Build-red leg
      # always() would report both green having verified nothing built.
      - name: Packaging guard — npm pack ships only the allowlist
        if: "!cancelled() && steps.build.outcome == 'success'"
        # The check itself lives in `scripts/packaging-guard.mjs`, not inline
        # here, so it survives this workflow and can be run on a developer's
        # machine (`scripts/ci-local.sh`). Behaviour is unchanged by the move.
        run: node scripts/packaging-guard.mjs

      - name: Boot smoke — start server, hit /api/meta and /, shut down
        if: "!cancelled() && steps.build.outcome == 'success'"
        # Extracted to `scripts/boot-smoke.sh` for the same reason. NOTE for
        # anyone grepping: the `rhizomorph running at` marker this smoke keys
        # on now lives in that script, and `boot-line.test.ts` follows it there.
        run: bash scripts/boot-smoke.sh

  # Delivery maturity, tested rather than assumed (2026-08-06 external
  # audit): packs the repo the way a release would, installs the tarball
  # into a project that has never heard of this checkout, and runs the CLI
  # from those installed files. The full os x node grid, because that is
  # exactly the claim this job exists to back: Linux, macOS and Windows,
  # the declared minimum node and the current one.
  pack-smoke:
    # windows-latest joined this job on 2026-09-03 (#211, prd-25 ruling 1). It
    # bills 2x ubuntu-latest (macos-latest bills 10x — see build-test-boot's
    # note above), measured at 1.5–3 min per leg across its first green
    # runs (e.g. https://github.com/launchpad-26/rhizomorph/actions/runs/33689381056)
    # against ~40s for an ubuntu leg. It joins THIS job and not build-test-boot deliberately: the
    # suite has known native-Windows failures (#277: 130 across 15 files) and
    # no committed expected-fail list yet, so a build-test-boot Windows leg
    # would be permanently red, and a leg that is always red teaches everyone
    # to ignore it. #212 commits that list; whether windows-latest then joins
    # build-test-boot is a separate decision, made with this leg's measured
    # cost (prd-25 amendment, 2026-08-24). This leg is the first CI witness of
    # the pathToFileURL boot fix in packages/server/bin/rhizomorph.mjs, and the
    # runner is what proves scripts/pack-smoke.sh's process control under Git
    # Bash — that script's Windows notes say what POSIX cannot do there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [current, min]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (current, from engines)
        if: matrix.node == 'current'
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup Node (declared minimum, pinned exactly)
        if: matrix.node == 'min'
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Install (clean, lockfile-honest)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack, install into a clean project, run the installed CLI
        # Git Bash on the Windows leg (the runner's default shell there is
        # pwsh). The script keys its Windows branches on `uname -s`, not on
        # the matrix, so it behaves the same run by hand from a Git Bash prompt.
        shell: bash
        run: bash scripts/pack-smoke.sh
