name: CI

on:
  push:
    branches: [main]
  pull_request:

# prd-34 (#563) adds `electron` as a devDependency of `packages/app`, and
# electron's postinstall downloads a ~110 MB platform binary. NOTHING in this
# workflow launches it: the shell's own tests are pure (`packages/app/src/host/`
# imports no electron at all), `npm run build` only bundles the main process
# with esbuild, and the boot smoke drives the plain CLI. Every leg here would
# therefore pay for a binary none of them runs — seven downloads per push.
#
# The binary IS downloaded where it is actually needed: #565's packaging
# workflow builds the installers and deliberately does not set this.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  build-test-boot:
    # macos-latest bills 10x ubuntu-latest, so it runs the suite once (at
    # current node) rather than doubling with the min-node leg too — the
    # min-node floor still gets checked, on the cheaper runner. The
    # macOS leg exists because a case-only filename collision (#201's class)
    # is invisible on Linux's case-sensitive filesystem and silent on
    # checkout on macOS's default case-insensitive one — this is the leg
    # that would have caught it before a user did.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [current, min]
        exclude:
          - os: macos-latest
            node: min
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (current, from engines)
        if: matrix.node == 'current'
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup Node (declared minimum, pinned exactly)
        if: matrix.node == 'min'
        uses: actions/setup-node@v4
        with:
          # The floor package.json's engines.node declares — pinned exactly,
          # not resolved by setup-node's usual range matching, so a bump to
          # the declared minimum is verified rather than assumed.
          node-version: '22.22.2'

      - name: Install (clean, lockfile-honest)
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        if: "!cancelled()"
        run: npm run typecheck

      - name: Lint
        if: "!cancelled()"
        run: npm run lint

      # Gated on Build's own outcome, not always(): the packaging guard only
      # flags UNEXPECTED files and passes vacuously over an empty dist/, and
      # the boot smoke's bin falls back to running TS source when dist is
      # absent (packages/server/bin/rhizomorph.mjs) — so on a Build-red leg
      # always() would report both green having verified nothing built.
      - name: Packaging guard — npm pack ships only the allowlist
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: |
          set -e
          node <<'NODE_EOF'
          const { execSync } = require('node:child_process')
          const out = execSync('npm pack --dry-run --json').toString()
          const [pkg] = JSON.parse(out)
          const allowed = [
            /^package\.json$/,
            /^README\.md$/,
            /^LICENSE$/,
            /^packages\/server\/dist\//,
            /^packages\/server\/bin\//,
            /^packages\/web\/dist\//,
          ]
          const files = pkg.files.map((f) => f.path)
          const unexpected = files.filter((f) => !allowed.some((re) => re.test(f)))
          if (unexpected.length > 0) {
            console.error('Packaging guard failed — unexpected files in npm pack output:')
            for (const f of unexpected) console.error(`  ${f}`)
            process.exit(1)
          }
          console.log(`Packaging guard passed — ${files.length} files, all allowlisted.`)
          NODE_EOF

      - name: Boot smoke — start server, hit /api/meta and /, shut down
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: |
          set -e

          npm start -- --port 0 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          URL=""
          for _ in $(seq 1 30); do
            if grep -q "rhizomorph running at" server.log; then
              URL=$(grep -o 'http://[^ ]*' server.log | head -n1)
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "server exited before printing a listening URL:"
              cat server.log
              exit 1
            fi
            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "server did not print a listening URL within 30s:"
            cat server.log
            exit 1
          fi
          echo "server listening at $URL"

          META_OK=""
          for _ in $(seq 1 30); do
            if curl -sf "$URL/api/meta" -o meta.json; then
              META_OK=1
              break
            fi
            sleep 1
          done

          if [ -z "$META_OK" ]; then
            echo "/api/meta never answered within 30s:"
            cat server.log
            exit 1
          fi
          echo "/api/meta responded:"
          cat meta.json
          echo

          ROOT_CONTENT_TYPE=$(curl -sI "$URL/" | grep -i '^content-type:' | tr -d '\r\n')
          echo "/ responded with: $ROOT_CONTENT_TYPE"
          case "$ROOT_CONTENT_TYPE" in
            *text/html*) ;;
            *)
              echo "expected / to return HTML, got: $ROOT_CONTENT_TYPE"
              cat server.log
              exit 1
              ;;
          esac

          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          echo "server shut down cleanly"

  # Delivery maturity, tested rather than assumed (2026-08-06 external
  # audit): packs the repo the way a release would, installs the tarball
  # into a project that has never heard of this checkout, and runs the CLI
  # from those installed files. The full os x node grid, because that is
  # exactly the claim this job exists to back: Linux and macOS, the
  # declared minimum node and the current one.
  pack-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [current, min]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (current, from engines)
        if: matrix.node == 'current'
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup Node (declared minimum, pinned exactly)
        if: matrix.node == 'min'
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Install (clean, lockfile-honest)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack, install into a clean project, run the installed CLI
        run: bash scripts/pack-smoke.sh
